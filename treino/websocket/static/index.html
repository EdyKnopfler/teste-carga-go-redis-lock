<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Demo</title>
</head>
<body>
    <h1>Mensagens do Broker</h1>
    <div id="messages" style="border: 1px solid #ccc; padding: 10px; width: 300px; height: 200px; overflow-y: auto;"></div>

    <script>
        const ws = new WebSocket(`ws://${window.location.host}/ws`);
        const messagesDiv = document.getElementById("messages");

        ws.onmessage = (event) => {
            const message = document.createElement("div");
            message.textContent = event.data;
            messagesDiv.appendChild(message);
            messagesDiv.scrollTop = messagesDiv.scrollHeight; // Rolar automaticamente
        };

        ws.onclose = () => {
            const message = document.createElement("div");
            message.textContent = "Conexão encerrada.";
            messagesDiv.appendChild(message);
        };
    </script>
</body>
</html>
